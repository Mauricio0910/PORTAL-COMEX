# COMEX LAB ND2 — GitHub + Render (Python nativo, sem dependências)
# Render com disco persistente requer plano pago.
services:
  - type: web
    name: comex-lab-nd2
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    buildCommand: python --version
    startCommand: python app.py serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: COMEX_DB
        value: /opt/render/project/src/storage/comex.sqlite3
      - key: COMEX_HTTPS
        value: "1"
      - key: PORT
        value: "10000"
      - key: COMEX_ADMIN_NAME
        value: Professor
      - key: COMEX_ADMIN_EMAIL
        sync: false
      - key: COMEX_ADMIN_PASSWORD
        sync: false
    disk:
      name: comex-nd2-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
